<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R-12 HTML 回归夹具（键盘不可操作反例）</title>
</head>
<body>
<h1 id="title">键盘不可操作页</h1>
<div id="mouse-only" role="button" aria-label="仅鼠标按钮" tabindex="-1"
     onclick="window.__lastActivation='mouse';">仅鼠标按钮</div>
<output id="result"></output>
</body>
</html>
