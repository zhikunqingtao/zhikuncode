<?xml version="1.0" encoding="UTF-8"?>
<!--
  huiwen-border.svg — 回纹/锁子纹边框带（可水平平铺 repeat-x）
  用途：面板/侧栏区块分隔带（demo 中作侧栏回纹分隔带，calm 灰调 / rich 描金）。
  出处：商周青铜器回纹与建筑彩画（连续方折螺旋，单元与 demo 内联回纹 mask 同构，已验证）。
  建议用法：
    · 单元 18×10，CSS：mask-image: url(...) left center / 18px 10px repeat-x，
      颜色用 background-color（建议 var(ink-fret-color)）+ opacity（ink-fret-opacity）。
    · 也可直接 background-image 平铺，currentColor 由 color 驱动。
    · 竖向使用时可 rotate(90deg) 或改 background-size 为 10px 18px repeat-y。
  注：注释中 ink-* / v2-* 为 tokens/ink-havoc-tokens.css 的 CSS 变量名（XML 注释不含双横线，实际变量带双横线前缀）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="10" viewBox="0 0 18 10"
     fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter">
  <!-- 单个回纹单元：外框起笔→顶梁→右柱→底梁内收→方折螺旋（repeat-x 连续排列即成回纹带） -->
  <path d="M1 9 V1 H15 V9 H5 V5 H11 V7"/>
</svg>
